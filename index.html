<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <title>超アイス姫のキャッスル</title>
    <style>
        h1{
            color:#e879a9
        }
        body{
            background-color: #fff0f5;
            text-align: center;
        }
        main{
            background-color: white;
            max-width: 700px;
            margin: 60px auto;
            padding: 32px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(200,100,150,0.18);
        }
        p {
            width: fit-content;
            margin: 12px auto;
            background-color: #fff8fc;
            border: 2px dashed #d138dc;
            border-radius: 12px;
            padding: 12px;
        }
        .count-box{
            background-color: white;
            border: 2px solid #e879a9;
            border-radius: 999px;
            color: #a63d6c;
            font-weight: bold;
        }
        #click-count{
            font-size: 1.3em;
        }
        button {
            background-color: #b24a78;
            color: white;
            border: none;
            border-radius: 999px;
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main>
     　<h1>超アイス姫のホームページへようこそ♡</h1>
     　<p>こんにちは！超アイス姫です♡</p>
    </main>
    <button id="surprise-button">♡押してね♡</button>
    <p class="count-box">押した回数:<span id="click-count">0</span>回</p>
    <audio id="button-sound" src="click.mp3" preload="auto"></audio>
    <script>
        let clickCount = 0;

        const button =document.getElementById("surprise-button");
        const sound =document.getElementById("button-sound");
        const countDisplay = document.getElementById("click-count");

        button.addEventListener("click",function () {
            clickCount = clickCount + 1;
            countDisplay.textContent = clickCount;

            sound.currentTime = 0;
            sound.play();

            button.textContent = "押してくれてありがとう♡"
        })
    </script>
</body>
</html>
